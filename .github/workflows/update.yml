name: Update playlist
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download sources
        run: |
          mkdir -p src
          curl -fsSL -o src/ru.m3u https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ru.m3u
          curl -fsSL -o src/by.m3u https://raw.githubusercontent.com/iptv-org/iptv/master/streams/by.m3u
          for f in channels logos categories; do
            curl -fsSL -o src/$f.csv https://raw.githubusercontent.com/iptv-org/database/master/data/$f.csv
          done
      - name: Build
        run: python3 build.py src ru-by.m3u ru-by-all-links.m3u
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ru-by.m3u ru-by-all-links.m3u
          git diff --cached --quiet || git commit -m "Daily playlist update"
          git push
